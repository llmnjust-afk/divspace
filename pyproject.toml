[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "divspace"
version = "0.1.0"
description = "Locating and stabilising the latent subspace that governs output diversity in language models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.3",
    "transformers>=4.44",
    "accelerate>=0.33",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
metrics = ["mauve-text>=0.4"]
semantic = ["sentencepiece>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
divspace = "divspace.cli:main"
divspace-launch = "divspace.launch:main"

[tool.setuptools.packages.find]
include = ["divspace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
